name: KidsPlay AI Studio CI & Sanity Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Syntax & Compilation Check
      run: |
        python -m py_compile server/main.py server/gemini_agent.py server/game_synthesizer.py server/security_guard.py server/evolution_engine.py server/resilience_manager.py kidsplay_watchdog.py

    - name: Environment Configuration Validation
      run: |
        cp .env.example .env
        python -c "
        import server.security_guard
        import server.game_synthesizer
        print('✅ Core security and synthesis modules initialized cleanly!')
        "

    - name: Synthesizer Multi-Genre Test
      run: |
        python -c "
        from server.game_synthesizer import synthesize_game_for_prompt
        genres = ['space rocket battle', 'candy catcher sweets', 'cartoon nitro racing', 'dungeon maze key', 'bubble pop splash', 'unicorn platformer']
        for g in genres:
            res = synthesize_game_for_prompt(g, 'gu-IN')
            assert 'game_code' in res, f'Missing code for {g}'
            assert len(res['game_code']) > 100, f'Code too short for {g}'
        print('✅ All 6 game genres synthesize successfully in <50ms!')
        "

    - name: Docker Build Smoke Test
      run: |
        docker build -t kidsplay-studio-test .
