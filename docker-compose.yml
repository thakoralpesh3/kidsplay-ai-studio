version: '3.8'

services:
  kidsplay-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kidsplay-ai-studio
    restart: unless-stopped
    ports:
      - "8899:8899"
    environment:
      - PORT=8899
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-4-argon
      - DEFAULT_LANGUAGE=gu-IN
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8899/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
